[package]
name = "workbench"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "sync", "fs", "io-util", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
fs4 = "0.13"
sha2 = "0.10"
notify = "7"
sys-locale = "0.3"
tauri-plugin-notification = "2"
# 挂账①: subscription downloader — reqwest+rustls is the clash-verge stack,
# the only non-browser transport empirically passing airport TLS-fingerprint
# walls (curl/openssl/python/.NET/curl_cffi all killed at the handshake).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# winreg is Windows-only (locale.rs reads the HKCU locale); it must not compile
# on Linux/macOS where the CI rust job builds the workbench lib.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

