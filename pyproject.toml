[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisc"
dynamic = ["version"]
description = "AISC CLI — Super Claude workstation management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AISC contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
aisc = "aisc.cli.main:main"

# G-02 (2026-08-10): docker SDK powers interactive sessions so the exec pty
# can be resized via exec_resize (docker CLI exec ptys are frozen at spawn).
dependencies = ["docker>=7.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "PyInstaller>=6", "PyYAML>=6"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.data-files]
aisc = ["VERSION"]

[tool.setuptools.dynamic]
version = { attr = "aisc.__version__" }
