name: Artifact

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            exe_suffix: ""
          - runner: windows-2022
            platform: windows
            arch: x86_64
            exe_suffix: ".exe"
          - runner: macos-14
            platform: macos
            arch: arm64
            exe_suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (editable)
        run: python -m pip install -e .

      - name: Install PyInstaller 6.21.0
        run: python -m pip install PyInstaller==6.21.0

      - name: Run packaging unit tests
        run: python -m unittest discover -s tests/packaging -p "test_*.py" -v

      - name: Build onedir (CI smoke only)
        run: python -m PyInstaller --onedir --name aisc --paths src --distpath "${{ runner.temp }}/onedir-dist" --workpath "${{ runner.temp }}/onedir-work" --specpath "${{ runner.temp }}" packaging/pyinstaller/entrypoint.py

      - name: Smoke onedir version
        run: python packaging/ci_smoke.py --executable "${{ runner.temp }}/onedir-dist/aisc/aisc${{ matrix.exe_suffix }}" --expected-version-file VERSION

      - name: Build onefile
        run: python -m PyInstaller --onefile --name aisc --paths src --distpath "${{ runner.temp }}/onefile-dist" --workpath "${{ runner.temp }}/onefile-work" --specpath "${{ runner.temp }}" packaging/pyinstaller/entrypoint.py

      - name: Stage bundle
        run: python packaging/artifact.py stage --output "${{ runner.temp }}/staging"

      - name: Verify staged bundle
        run: python packaging/artifact.py verify --bundle "${{ runner.temp }}/staging/aisc-bundle"

      - name: Create archive
        run: python packaging/artifact.py archive --staging "${{ runner.temp }}/staging" --executable "${{ runner.temp }}/onefile-dist/aisc${{ matrix.exe_suffix }}" --output "${{ runner.temp }}/dist" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Final smoke (checkout-independent)
        run: python packaging/ci_smoke.py --archive-dir "${{ runner.temp }}/dist"

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dist/AISC-*.tar.gz
            ${{ runner.temp }}/dist/AISC-*.tar.gz.sha256
            ${{ runner.temp }}/dist/AISC-*.zip
            ${{ runner.temp }}/dist/AISC-*.zip.sha256
          retention-days: 7

  aggregate:
    name: Aggregate SHA256SUMS
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives

      - name: Aggregate and verify
        run: python packaging/artifact.py aggregate --directory archives --expected linux-x86_64,windows-x86_64,macos-arm64

      - name: Upload aggregated artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISC-workflow-artifacts
          path: |
            archives/AISC-*.tar.gz
            archives/AISC-*.tar.gz.sha256
            archives/AISC-*.zip
            archives/AISC-*.zip.sha256
            archives/SHA256SUMS
          retention-days: 7
