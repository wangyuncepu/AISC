name: Workbench CI

# GUI fine-tune Step 0 (06-implementation-plan.md §0.3): every push/PR touching
# the workbench or CLI must at least run npm ci + build + frontend tests,
# cargo tests, and (when the CLI is involved) the Python suite. Path filters
# are asserted statically by tests/test_workflow_contract.py - keep them in
# sync with that test.

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'workbench/src/**'
      - 'workbench/package.json'
      - 'workbench/package-lock.json'
      - 'workbench/vite.config.*'
      - 'workbench/tsconfig*.json'
      - 'workbench/src-tauri/**'
      - 'src/aisc/**'
      - '.github/workflows/workbench-ci.yml'
      - 'tests/fixtures/**'
      - 'tests/test_baseline.py'
      - 'tests/test_cli_fixtures.py'
      - 'tests/test_workflow_contract.py'
      - 'scripts/baseline/**'
      - 'scripts/verify-cli-install.py'
      - 'pyproject.toml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'workbench/src/**'
      - 'workbench/package.json'
      - 'workbench/package-lock.json'
      - 'workbench/vite.config.*'
      - 'workbench/tsconfig*.json'
      - 'workbench/src-tauri/**'
      - 'src/aisc/**'
      - '.github/workflows/workbench-ci.yml'
      - 'tests/fixtures/**'
      - 'tests/test_baseline.py'
      - 'tests/test_cli_fixtures.py'
      - 'tests/test_workflow_contract.py'
      - 'scripts/baseline/**'
      - 'scripts/verify-cli-install.py'
      - 'pyproject.toml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # vitest 4.1's forks worker fails to start on Node 20; local dev is
          # Node 22 and the suite runs green there - keep CI on the same major.
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Install deps
        working-directory: workbench
        run: npm ci

      - name: Build (vue-tsc + vite)
        working-directory: workbench
        run: npm run build

      - name: Frontend tests
        working-directory: workbench
        run: npm test -- --run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workbench/src-tauri

      - name: Stage sidecar stub + bundle resource for tauri-build
        run: |
          # tauri-build validates externalBin/resource existence at compile
          # time; bundle workflows stage the real artifacts before `tauri
          # build`, a test-only job only needs placeholders.
          mkdir -p workbench/src-tauri/binaries workbench/src-tauri/nsis/bundle
          touch workbench/src-tauri/binaries/aisc-x86_64-unknown-linux-gnu
          mkdir -p workbench/src-tauri/nsis/bundle/aisc-bundle

      - name: Cargo test
        working-directory: workbench/src-tauri
        run: cargo test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest tests -q

      # Stage 2 (S2.1, CLI-A01): clean-room install smoke. Builds wheel+sdist,
      # installs each into fresh venvs (repeat-install + uninstall round-trip),
      # and runs a pipx smoke when pipx is available.
      - name: CLI clean-room install smoke (CLI-A01)
        run: |
          pip install --quiet build pipx
          python scripts/verify-cli-install.py

      # Stage 0 (S0.3, B-A02/B-A04): Unix-side baseline probe. A missing
      # critical tool fails the job (--strict); latest.json is kept as an
      # artifact so the fixture_hashes / toolchain are auditable after the run.
      - name: Baseline probe (Unix)
        run: |
          python scripts/baseline/run_baseline.py \
            --out baseline-out \
            --fixtures tests/fixtures \
            --strict

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-manifest
          path: baseline-out/
