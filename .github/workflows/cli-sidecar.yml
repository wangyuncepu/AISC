name: CLI sidecar build

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'src/aisc/**'
      - 'packaging/**'
      - 'scripts/build-cli.*'
      - 'VERSION'
      - 'pyproject.toml'

jobs:
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller build
          pip install -e .

      - name: Build CLI sidecar
        shell: bash
        run: |
          TARGET_TRIPLE=${{ matrix.triple }} scripts/build-cli.sh
        if: matrix.os != 'windows-latest'

      - name: Build CLI sidecar (Windows)
        shell: pwsh
        run: |
          $env:TARGET_TRIPLE = "${{ matrix.triple }}"
          scripts/build-cli.ps1
        if: matrix.os == 'windows-latest'

      - name: Verify artifact
        shell: bash
        run: |
          ls -la dist/
        if: always()

      # Stage 2 (S2.5, CLI-A05): the wheel-installed pip CLI and the frozen
      # sidecar must agree on the aisc.cli/v1 command matrix. Any difference
      # fails the build.
      - name: Dual-track parity smoke (CLI-A05)
        shell: bash
        run: |
          set -e
          SIDECAR=$(ls dist/aisc-* | head -1)
          echo "sidecar: $SIDECAR"
          B="$RUNNER_TEMP/aisc-parity"
          mkdir -p "$B"
          python -m build --outdir "$B" >/dev/null
          python -m venv "$B/venv"
          VENV_PY=$(ls "$B/venv/Scripts/python.exe" "$B/venv/bin/python" 2>/dev/null | head -1)
          "$VENV_PY" -m pip install --quiet "$B"/aisc-*.whl
          CLI_A=$(ls "$B/venv/Scripts/aisc.exe" "$B/venv/bin/aisc" 2>/dev/null | head -1)
          test -n "$CLI_A"
          echo "pip cli: $CLI_A"
          python scripts/verify-cli-parity.py --cli-a "$CLI_A" --cli-b "$SIDECAR"

      # Stage 2 (S2.6, CLI-A07): clean-room smoke + manifest (sha256/arch/version).
      - name: Sidecar clean-room smoke + manifest (CLI-A07)
        shell: bash
        run: |
          SIDECAR=$(ls dist/aisc-* | head -1)
          python scripts/verify-sidecar.py smoke "$SIDECAR" --triple "${{ matrix.triple }}" \
            > dist/aisc-sidecar-manifest.json
          cat dist/aisc-sidecar-manifest.json

      # Stage 2 (S2.7, CLI-A08): dependency SBOM + pip-check integrity audit,
      # reusing the parity step's wheel + venv from RUNNER_TEMP.
      - name: Dependency SBOM + integrity audit (CLI-A08)
        shell: bash
        run: |
          B="$RUNNER_TEMP/aisc-parity"
          VENV_PY=$(ls "$B/venv/Scripts/python.exe" "$B/venv/bin/python" 2>/dev/null | head -1)
          python scripts/verify-sbom.py --wheel "$B"/aisc-*.whl --venv-python "$VENV_PY" \
            --out dist/aisc-sbom.json
          head -c 300 dist/aisc-sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: aisc-sidecar-${{ matrix.triple }}
          path: |
            dist/aisc-${{ matrix.triple }}*
            dist/aisc-sidecar-manifest.json
            dist/aisc-sbom.json
          if-no-files-found: error
