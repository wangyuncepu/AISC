name: CLI sidecar build

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'src/aisc/**'
      - 'packaging/**'
      - 'scripts/build-cli.*'
      - 'VERSION'
      - 'pyproject.toml'

jobs:
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            shell: bash
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            shell: pwsh
          - os: macos-latest
            triple: aarch64-apple-darwin
            shell: bash

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build CLI sidecar
        shell: ${{ matrix.shell }}
        run: |
          TARGET_TRIPLE=${{ matrix.triple }} scripts/build-cli.sh
        if: matrix.shell == 'bash'

      - name: Build CLI sidecar (Windows)
        shell: pwsh
        run: |
          $env:TARGET_TRIPLE = "${{ matrix.triple }}"
          scripts/build-cli.ps1
        if: matrix.shell == 'pwsh'

      - name: Verify artifact
        shell: ${{ matrix.shell }}
        run: |
          ls -la dist/
        if: always()

      - uses: actions/upload-artifact@v4
        with:
          name: aisc-sidecar-${{ matrix.triple }}
          path: dist/aisc-${{ matrix.triple }}*
          if-no-files-found: error
